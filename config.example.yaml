eia:
  api_key: "YOUR_EIA_API_KEY"
  base_url: "https://api.eia.gov/v2"

fred:
  api_key: "YOUR_FRED_API_KEY"

data:
  start_date: "2015-01-01"
  end_date: null  # null means today
  oil_tickers:
    - "CL=F"  # WTI crude (target)
    - "BZ=F"  # Brent crude
  fred_series:
    usd_index: "DTWEXBGS"       # Trade Weighted US Dollar Index: Broad, Goods
    cpi: "CPIAUCSL"             # Consumer Price Index
    fed_funds: "DFF"            # Federal Funds Effective Rate
    t10y2y: "T10Y2Y"            # 10-Year minus 2-Year Treasury spread
    # ── Financial conditions & systemic risk ──────────────────────────────
    nfci:         "NFCI"              # Chicago Fed National Financial Conditions Index (weekly)
    stlfsi:       "STLFSI4"           # St. Louis Fed Financial Stress Index (weekly)
    epu_us:       "USEPUINDXD"        # US Economic Policy Uncertainty Index (daily)
    epu_global:   "GEPUPPP"           # Global Economic Policy Uncertainty (monthly)
    # ── Real economy / demand ─────────────────────────────────────────────
    pmi_mfg:      "NAPM"              # ISM Manufacturing PMI (monthly)
    retail_gas:   "GASREGCOVW"        # US Regular Gasoline Retail Price (weekly, EIA via FRED)
    miles_driven: "M12MTVUSM227NFWA"  # Vehicle Miles Travelled (monthly)
    # ── Fed balance sheet / liquidity ─────────────────────────────────────
    fed_balance:  "WALCL"             # Fed total assets — QE/QT liquidity proxy (weekly)
    rrp:          "RRPONTSYD"         # Overnight reverse repo — excess liquidity gauge (daily)
    # ── Credit / risk appetite ────────────────────────────────────────────
    ig_spread:    "BAMLC0A0CM"        # ICE BofA US Investment Grade OAS (daily)
    ted_spread:   "TEDRATE"           # TED spread — interbank stress proxy (daily)
  eia_series:
    crude_stocks:      "PET.WTTSTUS1.W"   # Weekly U.S. Ending Stocks of Crude Oil
    production:        "PET.WCRFPUS2.W"   # Weekly U.S. Crude Oil Production
    gasoline_stocks:   "PET.WGFUPUS2.W"   # Weekly U.S. Gasoline Stocks
    distillate_stocks: "PET.WDISTUS1.W"   # Weekly U.S. Distillate Fuel Stocks
    crude_imports:     "PET.WCRRIUS2.W"   # Weekly U.S. Crude Oil Imports
    spr:               "PET.WCRSTUS1.W"   # Weekly U.S. Strategic Petroleum Reserve
    # ── Natural gas storage (inter-fuel competition signal) ──────────────────
    # Note: US oil rig count (Baker Hughes) is not available via EIA API v2
    nat_gas_stocks:    "NG.NW2_EPG0_SWO_R48_BCF.W"  # Natural gas storage lower-48 (BCF, weekly)

  # ── Optional: per-series FRED publication-lag overrides (calendar days) ──
  # Defaults in src/data_engineering.py FRED_PUBLICATION_LAG_DAYS are
  # conservative upper bounds based on each agency's release calendar.
  # Override here if you know a tighter publication schedule.  Pass {} to
  # disable FRED shifting entirely.  Keys match the descriptive names under
  # `fred_series:` above.
  # fred_publication_lags:
  #   unemployment: 38
  #   cpi: 45

alpha_vantage:
  api_key: "YOUR_ALPHA_VANTAGE_API_KEY"  # https://www.alphavantage.co/support/#api-key
  base_url: "https://www.alphavantage.co/query"
  series:
    av_consumer_sentiment: "CONSUMER_SENTIMENT"  # University of Michigan Consumer Sentiment
    av_nonfarm_payroll:   "NONFARM_PAYROLL"       # US Nonfarm Payrolls (demand proxy)
    av_real_gdp:          "REAL_GDP"              # Quarterly real GDP growth (demand baseline)
    av_wti_spot:          "WTI"                   # WTI crude spot price from AV (cross-check)
    av_natural_gas:       "NATURAL_GAS"           # Henry Hub spot (monthly, cross-check)
    av_copper:            "COPPER"                # LME copper price — industrial demand composite
    av_global_cpi:        "CPI"                   # US CPI (monthly AV version)

cot:
  enabled: true  # CFTC Commitments of Traders — WTI speculative positioning (no API key)

market_tickers:
  # ── Currencies (USD vs oil-relevant economies) ──────────────────────────────
  usd_index_yf: "DX-Y.NYB"    # US Dollar Index (ICE)
  eur_usd:      "EURUSD=X"    # Euro / USD
  gbp_usd:      "GBPUSD=X"    # British Pound / USD
  usd_cad:      "USDCAD=X"    # USD / Canadian Dollar (petrocurrency)
  usd_nok:      "USDNOK=X"    # USD / Norwegian Krone (petrocurrency)
  usd_rub:      "USDRUB=X"    # USD / Russian Ruble
  usd_cny:      "USDCNY=X"    # USD / Chinese Renminbi
  aud_usd:      "AUDUSD=X"    # Australian Dollar / USD (commodity currency)
  nzd_usd:      "NZDUSD=X"    # New Zealand Dollar / USD
  usd_chf:      "USDCHF=X"    # USD / Swiss Franc (safe-haven proxy)
  # ── Energy commodities ───────────────────────────────────────────────────────
  nat_gas:      "NG=F"        # Henry Hub Natural Gas Futures
  gasoline:     "RB=F"        # RBOB Gasoline Futures ($/gallon)
  heating_oil:  "HO=F"        # Heating Oil Futures ($/gallon)
  # ── Energy equities & ETFs ──────────────────────────────────────────────────
  xle:          "XLE"         # Energy Select Sector SPDR (broad sector)
  oih:          "OIH"         # VanEck Oil Services ETF (drilling/services)
  xop:          "XOP"         # SPDR S&P Oil & Gas Exploration ETF
  xom:          "XOM"         # ExxonMobil
  cvx:          "CVX"         # Chevron
  bp:           "BP"          # BP plc (ADR)
  cop:          "COP"         # ConocoPhillips
  shel:         "SHEL"        # Shell plc (ADR)
  # ── Macro demand proxies ─────────────────────────────────────────────────────
  sp500:        "^GSPC"       # S&P 500 — broad US economic health
  jets:         "JETS"        # US Global Jets ETF — air travel / jet fuel demand
  gold:         "GC=F"        # Gold Futures — inflation / risk-off proxy
  silver:       "SI=F"        # Silver Futures
  copper:       "HG=F"        # Copper Futures — global industrial demand
  vix:          "^VIX"        # CBOE Volatility Index — market fear gauge
  eem:          "EEM"         # iShares MSCI Emerging Markets ETF
  dbc:          "DBC"         # Invesco DB Commodity Index
  # ── Interest rates (yields) ─────────────────────────────────────────────────
  t3m_yield:    "^IRX"        # 13-Week (3-Month) Treasury Bill yield
  t5y_yield:    "^FVX"        # 5-Year Treasury Note yield
  t10y_yield:   "^TNX"        # 10-Year Treasury Note yield (global benchmark)
  t30y_yield:   "^TYX"        # 30-Year Treasury Bond yield
  # ── Commodity complex (supply-side cost curves) ──────────────────────────
  lumber:       "LBS=F"       # Lumber — construction activity proxy
  wheat:        "ZW=F"        # Wheat — agri commodities move with energy costs
  corn:         "ZC=F"        # Corn — ethanol blend demand proxy
  # ── Shipping / freight ───────────────────────────────────────────────────
  bdry:         "BDRY"        # Breakwave Dry Bulk Shipping ETF (BDI proxy)
  # ── Energy transition pressure ────────────────────────────────────────────
  icln:         "ICLN"        # iShares Global Clean Energy ETF
  lithium:      "LIT"         # Lithium ETF — EV adoption proxy
  tan:          "TAN"         # Invesco Solar ETF
  # ── Equity volatility term structure ──────────────────────────────────────
  vix3m:        "^VIX3M"      # 3-Month VIX — term structure vs spot VIX

features:
  lag_days: [1, 3, 7, 30]           # Autoregressive lags of the target
  exog_lag_days: [7, 14]            # Lags applied to macro/exogenous variables
  rolling_windows: [14, 50, 200]    # Windows for SMA, EMA, and rolling volatility
  bollinger_window: 20              # Bollinger Band window
  rsi_period: 14                    # RSI lookback period
  target: "CL=F_close"
  # ── Target transformation ────────────────────────────────────────────────
  # 'level'      = predict raw price (legacy; lag_1 dominates because the
  #                price series is near-random-walk, masking real signal).
  # 'log_return' = predict log(P_{t+1}/P_t); price reconstructed on display.
  #                Stationary target lets structural features carry weight.
  target_transform: "log_return"

  # ── MACD parameters (previously hardcoded 12/26/9) ──────────────────────
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9

  # ── Additional momentum indicators ───────────────────────────────────────
  atr_period: 14                   # Average True Range — realised volatility proxy
  williams_r_period: 14            # Williams %R — overbought/oversold momentum
  stochastic_k_period: 14          # Stochastic %K
  stochastic_d_period: 3           # Stochastic %D (smoothed signal line)
  cmf_period: 20                   # Chaikin Money Flow — volume-weighted buying pressure

  # ── Rolling cross-asset correlations ────────────────────────────────────
  correlation_windows: [30, 90]    # Rolling corr of WTI vs each pair below
  correlation_pairs:               # Must match keys in market_tickers
    - "usd_index_yf"
    - "gold"
    - "sp500"
    - "copper"
    - "nat_gas"

  # ── Longer momentum windows (quarter/half-year) ──────────────────────────
  momentum_windows: [21, 63, 126]  # 1-month, 1-quarter, 6-month returns

  # ── Seasonality flags ────────────────────────────────────────────────────
  seasonal_flags:
    driving_season: true           # 1 between Memorial Day and Labor Day
    heating_season: true           # 1 Oct–Mar
    us_holidays: true              # 1 on US federal holidays

model:
  active_mode: fast                    # "fast" or "thorough"

  # ── Fast preset: fewer lambdas, soft hard cap, moderate steps/folds ──────
  # Hard cap target_max_terms=30 gives n/k ≈ 25 on ~750 obs (rough floor
  # for parametric stability).  λ floor of 0.1 keeps splines genuinely
  # regularised — λ=0.01 with n_splines=25 was effectively unconstrained.
  fast:
    stepwise_selection: true
    stepwise_criterion: aic
    stepwise_max_steps: 50
    target_max_terms: 30
    lam_search: [0.1, 1, 10, 100]
    cv_splits: 3
    sigma_stepwise: true
    sigma_max_terms: null
    nu_max_terms: null
    tau_max_terms: null

  # ── Thorough preset: full grid, hard cap, more steps/folds ───────────────
  thorough:
    stepwise_selection: true
    stepwise_criterion: bic
    stepwise_max_steps: 50
    target_max_terms: 25               # Hard cap on mu model terms
    lam_search: [0.1, 1, 10, 100, 1000]
    cv_splits: 5
    sigma_stepwise: true
    sigma_max_terms: 12
    nu_max_terms: 8
    tau_max_terms: 8

  # ── Shared settings (apply to both presets, overridable per preset) ──────
  n_splines: 25
  embargo_days: 200                    # Obs to drop between train/test boundary
  n_jobs: -1                           # Parallel workers: -1 = all CPUs
  nu_tau_window: 60                    # Rolling window for skewness/kurtosis
