eia:
  api_key: "YOUR_EIA_API_KEY"
  base_url: "https://api.eia.gov/v2"

fred:
  api_key: "YOUR_FRED_API_KEY"

data:
  start_date: "2015-01-01"
  end_date: null  # null means today
  oil_tickers:
    - "CL=F"  # WTI crude
    - "BZ=F"  # Brent crude
  fred_series:
    usd_index:    "DTWEXBGS"       # Trade Weighted US Dollar Index: Broad, Goods
    cpi:          "CPIAUCSL"       # Consumer Price Index (monthly, lagging)
    fed_funds:    "DFF"            # Federal Funds Effective Rate
    t10y2y:       "T10Y2Y"         # 10-Year minus 2-Year Treasury spread
    # ── Oil-specific risk & forward inflation ─────────────────────────────────
    ovx:          "OVXCLS"         # CBOE Crude Oil ETF Volatility Index (daily)
    t5yie:        "T5YIE"          # 5-Year Breakeven Inflation Rate (daily)
    t10yie:       "T10YIE"         # 10-Year Breakeven Inflation Rate (daily)
    hy_spread:    "BAMLH0A0HYM2"  # ICE BofA US High Yield OAS (daily)
    # ── Real-economy demand drivers ───────────────────────────────────────────
    indpro:       "INDPRO"         # Industrial Production Index (monthly)
    oil_prod_ip:  "IPG211111CN"    # Industrial Production: Crude Oil Extraction (monthly)
    cap_util:     "TCU"            # Capacity Utilization: Total Index (monthly)
    unemployment: "UNRATE"         # Unemployment Rate (monthly)
    # ── Financial conditions & systemic risk ──────────────────────────────
    nfci:         "NFCI"              # Chicago Fed National Financial Conditions Index (weekly)
    stlfsi:       "STLFSI4"           # St. Louis Fed Financial Stress Index (weekly)
    epu_us:       "USEPUINDXD"        # US Economic Policy Uncertainty Index (daily; lagged 30d)
    epu_global:   "GEPUPPP"           # Global Economic Policy Uncertainty (monthly)
    # ── Real economy / demand ─────────────────────────────────────────────
    pmi_mfg:      "NAPM"              # ISM Manufacturing PMI (monthly)
    igrea:        "IGREA"             # Kilian Index of Global Real Economic Activity (monthly)
    retail_gas:   "GASREGCOVW"        # US Regular Gasoline Retail Price (weekly, EIA via FRED)
    miles_driven: "M12MTVUSM227NFWA"  # Vehicle Miles Travelled (monthly)
    # ── Fed balance sheet / liquidity ─────────────────────────────────────
    fed_balance:  "WALCL"             # Fed total assets — QE/QT liquidity proxy (weekly)
    rrp:          "RRPONTSYD"         # Overnight reverse repo — excess liquidity gauge (daily)
    # ── Credit / risk appetite ────────────────────────────────────────────
    ig_spread:    "BAMLC0A0CM"        # ICE BofA US Investment Grade OAS (daily)
    ted_spread:   "TEDRATE"           # TED spread — interbank stress proxy (daily)
  eia_series:
    crude_stocks:      "PET.WTTSTUS1.W"   # Weekly U.S. Ending Stocks of Crude Oil
    production:        "PET.WCRFPUS2.W"   # Weekly U.S. Crude Oil Production
    gasoline_stocks:   "PET.WGFUPUS2.W"   # Weekly U.S. Gasoline Product Supplied (demand proxy)
    distillate_stocks: "PET.WDISTUS1.W"   # Weekly U.S. Distillate Fuel Stocks
    crude_imports:     "PET.WCRRIUS2.W"   # Weekly U.S. Crude Oil Imports
    spr:               "PET.WCRSTUS1.W"   # Weekly U.S. Strategic Petroleum Reserve
    # ── Supply-demand identity completers ──────────────────────────────────────
    cushing_stocks:          "PET.W_EPC0_SAX_YCUOK_MBBL.W"  # Cushing OK stocks — WTI futures delivery point
    refinery_utilization:    "PET.WPULEUS3.W"                 # U.S. refinery utilization % of operable capacity
    crude_exports:           "PET.WCREXUS2.W"                 # U.S. crude oil exports (weekly, post-2015)
    jet_fuel_demand:         "PET.WKJUPUS2.W"                 # Jet fuel product supplied — aviation demand proxy
    total_products_supplied: "PET.WRPUPUS2.W"                 # Total petroleum products supplied — aggregate demand
    # ── Natural gas storage (inter-fuel competition signal) ──────────────────
    nat_gas_stocks:          "NG.NW2_EPG0_SWO_R48_BCF.W"     # Natural gas storage lower-48 (BCF, weekly)
    # ── NYMEX WTI futures term structure (Contracts 1–4, daily) ──────────────
    # Front-month vs deferred contracts → contango / backwardation, the single
    # strongest fundamental signal in oil pricing.  CL=F (Yahoo) is the rolled
    # front month only, so we pull the strip from EIA to compute spreads.
    wti_m1:                  "PET.RCLC1.D"   # NYMEX WTI Contract 1 (front month) $/bbl
    wti_m2:                  "PET.RCLC2.D"   # Contract 2 (1-month deferred)
    wti_m3:                  "PET.RCLC3.D"   # Contract 3 (2-month deferred)
    wti_m4:                  "PET.RCLC4.D"   # Contract 4 (3-month deferred)

alpha_vantage:
  api_key: "YOUR_ALPHA_VANTAGE_API_KEY"  # https://www.alphavantage.co/support/#api-key
  base_url: "https://www.alphavantage.co/query"
  series:
    av_consumer_sentiment: "CONSUMER_SENTIMENT"  # University of Michigan Consumer Sentiment
    av_nonfarm_payroll:    "NONFARM_PAYROLL"      # US Nonfarm Payrolls (employment demand proxy)
    av_retail_sales:       "RETAIL_SALES"         # Advance Monthly Retail Sales (consumer spending → gasoline demand)
    av_durables:           "DURABLES"             # Manufacturers' New Orders: Durable Goods (forward-looking industrial demand)
    av_real_gdp:           "REAL_GDP"             # Quarterly real GDP growth (demand baseline)
    av_wti_spot:           "WTI"                  # WTI crude spot price from AV (cross-check)
    av_natural_gas:        "NATURAL_GAS"          # Henry Hub spot (monthly, cross-check)
    av_copper:             "COPPER"               # LME copper price — industrial demand composite
    av_global_cpi:         "CPI"                  # US CPI (monthly AV version)

cot:
  enabled: true  # CFTC Commitments of Traders — WTI speculative positioning (no API key)

# ── Geopolitical Risk index (Caldara & Iacoviello 2022) — daily, no API key ──
# Fragile non-API xls scraper: on download failure the pipeline logs a warning
# and continues without GPR features (cached parquet reused if present).
gpr:
  enabled: true
  url: "https://www.matteoiacoviello.com/gpr_files/data_gpr_daily_recent.xls"

# ── GECON global economic conditions (Baumeister, Korobilis & Lee 2022) ──────
# Monthly xlsx; URL must point at a directly-downloadable file (the author's
# site hosts it via Google Drive — set a working mirror/local path here).
gecon:
  enabled: false
  url: ""

market_tickers:
  # ── Currencies (USD vs oil-relevant economies) ──────────────────────────────
  usd_index_yf: "DX-Y.NYB"    # US Dollar Index (ICE)
  eur_usd:      "EURUSD=X"    # Euro / USD
  gbp_usd:      "GBPUSD=X"    # British Pound / USD
  usd_cad:      "USDCAD=X"    # USD / Canadian Dollar (petrocurrency)
  usd_nok:      "USDNOK=X"    # USD / Norwegian Krone (petrocurrency)
  usd_rub:      "USDRUB=X"    # USD / Russian Ruble
  usd_cny:      "USDCNY=X"    # USD / Chinese Renminbi
  aud_usd:      "AUDUSD=X"    # Australian Dollar / USD (commodity currency)
  nzd_usd:      "NZDUSD=X"    # New Zealand Dollar / USD
  usd_chf:      "USDCHF=X"    # USD / Swiss Franc (safe-haven proxy)
  # ── Energy commodities ───────────────────────────────────────────────────────
  nat_gas:      "NG=F"        # Henry Hub Natural Gas Futures
  gasoline:     "RB=F"        # RBOB Gasoline Futures ($/gallon)
  heating_oil:  "HO=F"        # Heating Oil Futures ($/gallon)
  # ── Energy equities & ETFs ──────────────────────────────────────────────────
  xle:          "XLE"         # Energy Select Sector SPDR (broad sector)
  oih:          "OIH"         # VanEck Oil Services ETF (drilling/services)
  xop:          "XOP"         # SPDR S&P Oil & Gas Exploration ETF
  xom:          "XOM"         # ExxonMobil
  cvx:          "CVX"         # Chevron
  bp:           "BP"          # BP plc (ADR)
  cop:          "COP"         # ConocoPhillips
  shel:         "SHEL"        # Shell plc (ADR)
  # ── Macro demand proxies ─────────────────────────────────────────────────────
  sp500:        "^GSPC"       # S&P 500 — broad US economic health
  jets:         "JETS"        # US Global Jets ETF — air travel / jet fuel demand
  gold:         "GC=F"        # Gold Futures — inflation / risk-off proxy
  silver:       "SI=F"        # Silver Futures
  copper:       "HG=F"        # Copper Futures — global industrial demand
  vix:          "^VIX"        # CBOE Volatility Index — market fear gauge
  eem:          "EEM"         # iShares MSCI Emerging Markets ETF
  dbc:          "DBC"         # Invesco DB Commodity Index
  # ── Interest rates (yields) ─────────────────────────────────────────────────
  t3m_yield:    "^IRX"        # 13-Week (3-Month) Treasury Bill yield
  t5y_yield:    "^FVX"        # 5-Year Treasury Note yield
  t10y_yield:   "^TNX"        # 10-Year Treasury Note yield (global benchmark)
  t30y_yield:   "^TYX"        # 30-Year Treasury Bond yield
  # ── Commodity complex (supply-side cost curves) ──────────────────────────
  lumber:       "LBS=F"       # Lumber — construction activity proxy
  wheat:        "ZW=F"        # Wheat — agri commodities move with energy costs
  corn:         "ZC=F"        # Corn — ethanol blend demand proxy
  # ── Shipping / freight ───────────────────────────────────────────────────
  bdry:         "BDRY"        # Breakwave Dry Bulk Shipping ETF (BDI proxy)
  # ── Energy transition pressure ────────────────────────────────────────────
  icln:         "ICLN"        # iShares Global Clean Energy ETF
  lithium:      "LIT"         # Lithium ETF — EV adoption proxy
  tan:          "TAN"         # Invesco Solar ETF
  # ── Equity volatility term structure ──────────────────────────────────────
  vix3m:        "^VIX3M"      # 3-Month VIX — term structure vs spot VIX

features:
  lag_days: [1, 3, 7, 30]           # Autoregressive lags of the target
  exog_lag_days: [7, 14]            # Lags applied to macro/exogenous variables
  rolling_windows: [14, 50, 200]    # Windows for SMA, EMA, and rolling volatility
  bollinger_window: 20              # Bollinger Band window
  rsi_period: 14                    # RSI lookback period
  target: "CL=F_close"
  # ── Target transformation ────────────────────────────────────────────────
  # 'level' = predict raw price (legacy behaviour — near-random-walk → lag_1 dominates)
  # 'log_return' = predict log(P_{t+1}/P_t); price is reconstructed for display.
  # log_return makes the GAM's smooths fit a stationary signal and lets the
  # structural features carry real predictive weight.
  target_transform: "log_return"

  # ── MACD parameters ──────────────────────────────────────────────────────
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9

  # ── Additional momentum indicators ───────────────────────────────────────
  atr_period: 14                   # Average True Range — realised volatility proxy
  williams_r_period: 14            # Williams %R — overbought/oversold momentum
  stochastic_k_period: 14          # Stochastic %K
  stochastic_d_period: 3           # Stochastic %D (smoothed signal line)
  cmf_period: 20                   # Chaikin Money Flow — volume-weighted buying pressure

  # ── Range-based realised volatility (Parkinson/GK/Rogers-Satchell/Yang-Zhang)
  range_vol_windows: [5, 20, 60]   # Windows for the OHLC range-vol estimators

  # ── Rolling cross-asset correlations ────────────────────────────────────
  correlation_windows: [30, 90]    # Rolling corr of WTI vs each pair below
  correlation_pairs:               # Must match keys in market_tickers
    - "usd_index_yf"
    - "gold"
    - "sp500"
    - "copper"
    - "nat_gas"

  # ── Longer momentum windows (quarter/half-year) ──────────────────────────
  momentum_windows: [21, 63, 126]  # 1-month, 1-quarter, 6-month returns

  # ── Seasonality flags ────────────────────────────────────────────────────
  seasonal_flags:
    driving_season: true           # 1 between Memorial Day and Labor Day
    heating_season: true           # 1 Oct–Mar
    us_holidays: true              # 1 on US federal holidays

model:
  active_mode: fast                    # "fast" or "thorough"

  # ── Fast preset: fewer lambdas, soft hard cap, moderate steps/folds ──────
  fast:
    stepwise_selection: true
    stepwise_criterion: aic
    stepwise_max_steps: 30
    target_max_terms: 30
    lam_search: [1, 10, 100]
    cv_splits: 2
    sigma_stepwise: true
    sigma_max_terms: 12
    nu_max_terms: 8
    tau_max_terms: 8

  # ── Thorough preset: full grid, hard cap, more steps/folds ───────────────
  thorough:
    stepwise_selection: true
    stepwise_criterion: bic
    stepwise_max_steps: 50
    target_max_terms: 25               # Hard cap on mu model terms
    lam_search: [0.1, 1, 10, 100, 1000]
    cv_splits: 5
    sigma_stepwise: true
    sigma_max_terms: 12
    nu_max_terms: 8
    tau_max_terms: 8

  # ── Shared settings (apply to both presets, overridable per preset) ──────
  n_splines: 25
  embargo_days: 60                   # Obs to drop between train/test boundary
  n_jobs: -1                           # Parallel workers: -1 = all CPUs
  nu_tau_window: 60                    # Rolling window for skewness/kurtosis

  # ── Predictive-scale source (Phase 1) ────────────────────────────────────
  # 'gam'   = sigma-GAM on log|residual| (level-dependent only; default).
  # 'garch' = GARCH(1,1)/EWMA conditional sigma (serial volatility clustering).
  # 'blend' = 50/50 variance blend of the two.  Gated on CRPS/log-score/
  #           Berkowitz in the walk-forward backtest before flipping default.
  sigma_source: gam

  # ── Forecast-quality knobs ───────────────────────────────────────────────
  # Drop one feature from any pair with |Pearson ρ| above this threshold,
  # before stepwise BIC.  Set to 1.0 to disable.
  collinearity_threshold: 0.97
  # Pre-transform skewed features via empirical CDF so pyGAM's evenly-spaced
  # knots correspond to quantile-spaced knots in the original space.
  quantile_knots: true
  # Apply domain-driven monotonicity constraints (inventories↓price etc.)
  # to spline terms whose names match MONOTONIC_CONSTRAINTS in src/model.py.
  enable_monotonic: true
  # Add tensor-product te(i,j) interaction terms for the whitelist in
  # DEFAULT_INTERACTION_PAIRS (DXY×inventories, VIX×OVX, RSI×ATR, etc.).
  enable_interactions: true
  interaction_n_splines: 6
  interaction_lam: 10.0
  # Number of poor-man's GAMLSS iterations (re-fit μ with weights = 1/σ̂²).
  # Set 0 to disable.  1–2 typically converges; more is rarely useful.
  iterative_refits: 1
  # Bagged ensemble around μ (stationary bootstrap).
  bagging:
    enabled: true
    n_bags: 5
    block_length: 21
    random_state: 0
    n_jobs: 1
  # Direct quantile/expectile training in addition to the Gaussian + Johnson
  # SU pipeline.  Used by the dashboard to compare PI sources.
  expectile_levels: [0.05, 0.50, 0.95]
  # Split-conformal coverage target for distribution-free PI calibration.
  conformal_alpha: 0.10

# ── Walk-forward backtest (Step 6) ─────────────────────────────────────────
# Quarterly refit (63 trading days); test_period kept equal to refit_period for
# a continuous out-of-sample path.  Defaults if this section is absent: 21 / 21.
backtest:
  refit_period_days: 63
  test_period_days: 63

# ── Combinatorial Purged Cross-Validation backtest (Ch. 12) ────────────────
# Enable from the CLI with `python scripts/run_pipeline.py --cpcv` or here.
# Produces a distribution of backtest paths in outputs/backtests/cpcv/.
cpcv:
  enabled: true
  n_splits: 4        # C(4,2)=6 combinations
  n_test_splits: 2   # k — groups per test combination (book example: 2)
  pct_embargo: 0.01  # Fraction of total observations to embargo per fold
